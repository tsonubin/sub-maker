name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.1); empty uses workflow ref'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux: amd64 + arm64 binaries ───────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install aarch64 linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Configure cargo for cross-compile
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          cargo build --release --locked --target aarch64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/sub-maker sub-maker-linux-amd64
          cp target/aarch64-unknown-linux-gnu/release/sub-maker sub-maker-linux-arm64
          chmod 755 sub-maker-linux-amd64 sub-maker-linux-arm64

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: |
            sub-maker-linux-amd64
            sub-maker-linux-arm64

  # ── macOS: arm64 + amd64 (cross from Apple Silicon runner) ────────────
  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/sub-maker sub-maker-darwin-arm64
          cp target/x86_64-apple-darwin/release/sub-maker sub-maker-darwin-amd64
          chmod 755 sub-maker-darwin-arm64 sub-maker-darwin-amd64

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin
          path: |
            sub-maker-darwin-arm64
            sub-maker-darwin-amd64

  # ── Package + GitHub Release ────────────────────────────────────────────
  release:
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) VERSION="$TAG"; TAG="v$TAG" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($VERSION)"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Layout dist/
        run: |
          mkdir -p dist
          # artifacts may already be flat under dist/
          find dist -type f -name 'sub-maker-*' -exec mv -n {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - name: Install nfpm
        run: |
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_Linux_x86_64.tar.gz \
            | tar -xz -C /tmp nfpm
          sudo mv /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build deb + rpm
        run: |
          chmod +x scripts/package-linux.sh scripts/generate-homebrew-formula.sh
          ./scripts/package-linux.sh "${{ steps.ver.outputs.version }}" dist

      - name: Generate Homebrew formula
        run: |
          chmod +x scripts/generate-homebrew-formula.sh scripts/publish-homebrew-tap.sh
          ./scripts/generate-homebrew-formula.sh "${{ steps.ver.outputs.version }}" dist dist/sub-maker.rb

      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          FILES=(
            sub-maker-linux-amd64
            sub-maker-linux-arm64
            sub-maker-darwin-amd64
            sub-maker-darwin-arm64
            sub-maker.rb
            sub-maker_*.deb
            sub-maker-*.rpm
          )
          sha256sum "${FILES[@]}" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/sub-maker-linux-amd64
            dist/sub-maker-linux-arm64
            dist/sub-maker-darwin-amd64
            dist/sub-maker-darwin-arm64
            dist/sub-maker.rb
            dist/checksums.txt
            dist/*.deb
            dist/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Requires repo secret HOMEBREW_TAP_TOKEN (classic PAT with `repo` on tsonubin/homebrew-tap).
      - name: Publish formula to tsonubin/homebrew-tap
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: tsonubin/homebrew-tap
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skip tap publish."
            echo "Add a classic PAT (repo scope) as secret HOMEBREW_TAP_TOKEN to enable:"
            echo "  brew tap tsonubin/tap && brew install sub-maker"
            exit 0
          fi
          ./scripts/publish-homebrew-tap.sh "${{ steps.ver.outputs.version }}" dist/sub-maker.rb
