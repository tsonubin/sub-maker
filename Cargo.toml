[package]
name = "sub-maker"
version = "0.2.0"
edition = "2021"
description = "TUI tool to set up a proxy server on a VPS using sing-box"
license = "LicenseRef-Proprietary"
repository = "https://github.com/tsonubin/sub-maker"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
crossterm = "0.28"
hex = "0.4"
pem = "3"
ratatui = "0.29"
rand = "0.8"
rcgen = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"
x509-parser = "0.16"

[dev-dependencies]
tempfile = "3"
